    <path d="M17 19 V26 H33 V32"/>
    <path d="M49 19 V26"/>
  </g>

  <!-- nodes -->
  <g stroke="#9298a2" stroke-width="2">
    <rect x="6" y="7" width="22" height="12" rx="3" fill="#2a2c31"/>
    <rect x="38" y="7" width="22" height="12" rx="3" fill="#2a2c31"/>
    <rect x="22" y="32" width="22" height="12" rx="3" fill="#2a2c31"/>
